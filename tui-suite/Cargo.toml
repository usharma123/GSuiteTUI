[package]
name = "tui-suite"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
ropey = "1.6"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
axum = "0.8"
open = "5"
base64 = "0.22"
pulldown-cmark = "0.12"
keyring = "3"
thiserror = "2"
anyhow = "1"
directories = "6"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
futures = "0.3"
urlencoding = "2"
rand = "0.8"
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"
